name: Build Windows EXE (Downloadable Release)
# Rebuild trigger after repairing the shelf-label syntax.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-artifact.yml"
      - "src/**"
      - "electron/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Package Windows EXE files
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload EXE files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shop-Rush-2-Erfan-Edition-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Publish EXE files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Shop Rush 2 - Erfan Edition v1.0.2
          body: Windows installer and portable build.
          files: |
            release/*.exe
          fail_on_unmatched_files: true
          make_latest: true
