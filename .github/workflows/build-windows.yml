name: Build Shop Rush 2 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable EXE
        run: npm run dist:win -- --publish never
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Shop-Rush-2-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
