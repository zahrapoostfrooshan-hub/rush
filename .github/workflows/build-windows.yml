
name: Shop Rush 2 - Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.1)"
        required: true
        default: "v1.0.1"

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # 1. دریافت سورس پروژه
      - name: Checkout
        uses: actions/checkout@v4

      # 2. نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. نصب وابستگی‌ها
      - name: Install Dependencies
        run: npm install

      # 4. ساخت نسخه وب بازی
      - name: Build Game
        run: npm run build

      # 5. ساخت فایل‌های ویندوز
      - name: Build Windows Installers
        run: npx electron-builder --win nsis portable --publish never

      # 6. بررسی فایل‌های خروجی
      - name: Verify EXE Files
        shell: pwsh
        run: |
          if (!(Test-Path "release")) {
            throw "Release directory not found!"
          }

          $files = @(Get-ChildItem "release" -Filter "*.exe" -File)

          if ($files.Count -lt 2) {
            throw "Expected Setup and Portable EXE files."
          }

          Write-Host "Build completed successfully:"
          $files | ForEach-Object {
            Write-Host $_.Name
          }

      # 7. انتشار در GitHub Releases
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Shop Rush 2 - Erfan Edition ${{ inputs.version || github.ref_name }}
          body: |
            # Shop Rush 2 - Erfan Edition

            Windows 64-bit Edition

            ## Downloads

            - Windows Setup Installer
            - Portable Windows Version

            Built automatically using GitHub Actions.
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
