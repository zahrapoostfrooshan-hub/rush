
name: Shop Rush 2 - Windows Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npm run dist:win -- --publish never

      - name: Check Release Files
        shell: pwsh
        run: |
          if (!(Test-Path "release")) {
            throw "Release folder not found!"
          }

          $files = Get-ChildItem "release" -Filter "*.exe"

          if ($files.Count -lt 2) {
            throw "Setup and Portable EXE files were not both generated!"
          }

          Write-Host "Generated EXE files:"
          $files | ForEach-Object { Write-Host $_.FullName }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Shop Rush 2 - Erfan Edition v1.0.0
          body: |
            # Shop Rush 2 - Erfan Edition

            Windows 64-bit Release

            Included:
            - Windows Installer (Setup)
            - Portable Version

            Enjoy the game!
          draft: false
          prerelease: false
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
